<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}

.sub{color:var(--mute);margin:0 0 18px;font-size:15px}

.tabs button{flex:0 0 auto;font:inherit;font-size:15px;padding:10px 14px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lead{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin:0 0 14px}

.blk{margin:22px 0 0}
.gaps{display:grid;gap:8px;grid-template-columns:1fr}
.gap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}

.segs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding-left:16px}

.row{border-top:1px solid var(--line);padding:8px 0}

.row li{margin:0 0 6px;font-size:15px}
.words li{font-style:italic}

.hint{color:var(--mute);font-size:13px;margin:6px 0 0}

.facts li{margin:0 0 6px;font-size:15px}
.facts{padding-left:18px;margin:0}

footer{color:var(--mute);font-size:13px;margin-top:30px;border-top:1px solid var(--line);padding-top:12px}

 .gaps{grid-template-columns:1fr 1fr}
}

<script id="data" type="application/json">{"maps": [{"product": "obsolete-parts", "name": "Legacy Requests (obsolete parts)", "live_url": "https://legacy-requests.vercel.app", "one_liner": "Models demand from government RFPs. And supply from 3P vendors on places like ebay and online auction houses.", "steps": [{"id": "L1", "verb_object": "lists the makes and parts government agencies keep filing to buy, each linked to the agency's own filing", "url": "https://legacy-requests.vercel.app"}, {"id": "L2", "verb_object": "flags the same buyer asking for the same part number again, months or years apart", "url": "https://legacy-requests.vercel.app"}, {"id": "L3", "verb_object": "'Find it': links a part to listings for sale (eBay, GovDeals, PublicSurplus), its manual, and who services it", "url": "https://legacy-requests.vercel.app"}, {"id": "L4", "verb_object": "hands a dealer every agency that filed for a model the dealer has listed (/for/<token>/ pages)", "url": "https://legacy-requests.vercel.app"}], "segments": [{"name": "Independent legacy parts dealers", "who": "Surplus, remanufactured and repair dealers (e.g. MRO Electric) who find, repair and sell discontinued industrial automation parts.", "jobs": [{"text": "Find the part a customer needs", "cites": [{"id": "e_0f0c464fd6", "quote": "MRO can find the part you need; all you have to do is ask!", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}]}, {"text": "Repair CNCs, PLCs, drives, motors, HMIs", "cites": [{"id": "e_aa97610b4f", "quote": "MRO Electric repairs CNCs, PLCs, Servo/Spindle Drives, Motors, Amplifiers, VFDs, HMIs, and more.", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}]}, {"text": "Sell new, surplus and remanufactured stock", "cites": [{"id": "e_0f0c464fd6", "quote": "We sell factory new, new surplus and remanufactured products.", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}]}], "pains": [{"text": "Their customers' pain is downtime from failed drives, and dealers pitch themselves on minimizing it", "cites": [{"id": "e_9778fc75f5", "quote": "strive to minimize downtime, saving our clients time and money", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}]}, {"text": "At least one large dealer (Radwell) turned down a paid $500 buyer-report offer", "cites": [{"id": "e_2f0ae4c332", "quote": "Radwell InMail reply to the $500 buyer-report offer: \"not interested\"", "url": "", "date": "2026-10-05", "source_kind": "our_reply", "speaker_kind": "industrial surplus dealer (reply to us)"}]}], "workarounds": [{"text": "Answer customer requests directly and fast, by hand", "cites": [{"id": "e_d8d5924878", "quote": "We typically respond within 10 minutes during business hours.", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}]}], "wants": [{"text": "Back products with a long warranty", "cites": [{"id": "e_d8d5924878", "quote": "We offer a minimum two-year MRO warranty on all products.", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}]}], "words": [{"text": "factory new, new surplus and remanufactured", "cites": [{"id": "e_0f0c464fd6", "quote": "We sell factory new, new surplus and remanufactured products.", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}]}, {"text": "repairs and exchanges", "cites": [{"id": "e_21afe6eefb", "quote": "offering repairs and exchanges for manufacturers including, but not limited to: FANUC Automation CNC / Siemens CNC Automation", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}]}], "vouchers": [{"text": "Certified technicians and testing; a large customer base as social proof", "cites": [{"id": "e_c04b2df3e6", "quote": "All of our repaired parts are put through rigorous testing procedures by certified technicians to ensure that they are fully functional.", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}, {"id": "e_d8d5924878", "quote": "MRO's 15,000+ satisfied customers are a testament to our top-quality service.", "url": "https://www.mroelectric.com/about-us", "date": "2026-10-13", "source_kind": "web", "speaker_kind": "industrial surplus / legacy parts dealer (own site)"}]}], "questions": [{"text": "Which of my listed models do agencies actually file for, and where is the filing?", "cites": [], "hypothesis": true}, {"text": "Why would I pay for this when customers already ask me directly?", "cites": [{"id": "e_2f0ae4c332", "quote": "Radwell InMail reply to the $500 buyer-report offer: \"not interested\"", "url": "", "date": "2026-10-05", "source_kind": "our_reply", "speaker_kind": "industrial surplus dealer (reply to us)"}], "hypothesis": false}]}, {"name": "Water utility ops and purchasing", "who": "Operations chiefs and purchasing managers at public water utilities who keep aging pumps, drives and controls running.", "jobs": [{"text": "Get parts when the OEM no longer supports the equipment", "cites": [{"id": "e_892fd6f266", "quote": "If no OEM support, go to third party for parts, buy new/used from ebay, etc, patch, etc.", "url": "", "date": "2026-09-08", "source_kind": "our_reply", "speaker_kind": "Chief of Operations, a public water utility (reply to us)"}]}, {"text": "Buy ahead of the OEM's legacy date", "cites": [{"id": "e_892fd6f266", "quote": "If we know that the OEM has a legacy date, we buy items in advance.", "url": "", "date": "2026-09-08", "source_kind": "our_reply", "speaker_kind": "Chief of Operations, a public water utility (reply to us)"}]}, {"text": "Get failed drives repaired in an emergency", "cites": [{"id": "e_ac26f9f385", "quote": "emergency services to repair the variable frequency drives that power pumps 1 and 3 at the Reynolds Area Pumping Station", "url": "https://toledo.legistar.com/LegislationDetail.aspx?ID=41643&GUID=76106155-444A-46B0-BDDE-BB33B8BADE8B", "date": "2024-06-27", "source_kind": "filing", "speaker_kind": "public agency (own filing)"}]}], "pains": [{"text": "Aging drives become unreliable and hard to maintain because components are obsolete", "cites": [{"id": "e_efaef3bbd8", "quote": "The existing drives have exceeded their useful life and have become increasingly unreliable due to age and component obsolescence, making ongoing maintenance difficult.", "url": "https://mesa.legistar.com/LegislationDetail.aspx?ID=23646&GUID=91845EE0-19E2-4F31-9A94-944D0C8F19EC", "date": "2026-04-15", "source_kind": "filing", "speaker_kind": "public agency (own filing)"}]}, {"text": "Purchases must follow competitive bidding statute and policy", "cites": [{"id": "e_2411f8aba8", "quote": "All such purchases are subject to statute and policy with regard to competitive bidding requirements.", "url": "", "date": "2026-09-09", "source_kind": "our_reply", "speaker_kind": "Purchasing Manager, a public water utility (reply to us)"}]}, {"text": "Sometimes the only exit is to redesign and install new equipment", "cites": [{"id": "e_2411f8aba8", "quote": "At some point, it may become necessary to redesign and install new equipment.", "url": "", "date": "2026-09-09", "source_kind": "our_reply", "speaker_kind": "Purchasing Manager, a public water utility (reply to us)"}]}], "workarounds": [{"text": "Broad search including eBay, or the manufacturer's suggested substitutes", "cites": [{"id": "e_2411f8aba8", "quote": "We typically perform a broad search for available parts, including Ebay, and/or manufacturer's suggested substitutions.", "url": "", "date": "2026-09-09", "source_kind": "our_reply", "speaker_kind": "Purchasing Manager, a public water utility (reply to us)"}]}, {"text": "Design and fabricate a replacement part in-house", "cites": [{"id": "e_892fd6f266", "quote": "sometimes we can design/fabricate a viable replacement part.", "url": "", "date": "2026-09-08", "source_kind": "our_reply", "speaker_kind": "Chief of Operations, a public water utility (reply to us)"}]}, {"text": "Try several routes until the part is found", "cites": [{"id": "e_e1a97d034b", "quote": "We follow multiple paths until we have acquired what we need.", "url": "", "date": "2026-09-11", "source_kind": "our_reply", "speaker_kind": "Harford County MD (reply to the 9/10 follow-up), a public water utility (reply to us)"}]}], "wants": [], "words": [{"text": "legacy date", "cites": [{"id": "e_892fd6f266", "quote": "If we know that the OEM has a legacy date, we buy items in advance.", "url": "", "date": "2026-09-08", "source_kind": "our_reply", "speaker_kind": "Chief of Operations, a public water utility (reply to us)"}]}, {"text": "no OEM support", "cites": [{"id": "e_892fd6f266", "quote": "If no OEM support, go to third party for parts, buy new/used from ebay, etc, patch, etc.", "url": "", "date": "2026-09-08", "source_kind": "our_reply", "speaker_kind": "Chief of Operations, a public water utility (reply to us)"}]}], "vouchers": [{"text": "The manufacturer (suggested substitutions) and their own Operations or Engineering staff", "cites": [{"id": "e_2411f8aba8", "quote": "We typically perform a broad search for available parts, including Ebay, and/or manufacturer's suggested substitutions.", "url": "", "date": "2026-09-09", "source_kind": <script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let qid=0;
function cites(cs){
  if(!cs||!cs.length)return '';
  return cs.map((c,i)=>{const id='q'+(qid++);
    const src=c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.source_kind.replace('_',' '))}${c.date?' · '+esc(c.date):''}</a>`:`${esc(c.source_kind.replace('_',' '))}${c.date?' · '+esc(c.date):''} · private ledger`;
    return `<button class="c" aria-expanded="false" data-q="${id}">${i+1}</button><span class="q" id="${id}">“${esc(c.quote)}”<span class="src">${esc(c.speaker_kind)} — ${src}</span></span>`}).join('');
}
function list(items,cls){
  if(!items||!items.length)return '<p class="hint">Nothing in the evidence.</p>';
  return `<ul class="${cls||''}">`+items.map(it=>`<li>${esc(it.text)}${it.hypothesis?'<span class="hyp">hypothesis</span>':''}${cites(it.cites)}</li>`).join('')+'</ul>';
}
const ROWS=[['jobs','Trying to get done'],['pains','Where it hurts'],['workarounds','What they do today'],['words','Their words','words'],['vouchers','Who they trust'],['wants','What they ask for'],['questions',"They'd ask us"]];
function render(i){
  qid=0;const m=D.maps[i];
  document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  const gaps=m.job_map.filter(j=>!j.step||j.fit==='none');
  const part=m.job_map.filter(j=>j.step&&j.fit==='partial');
  let h='';
  if(m.surprise)h+=`<div class="lead"><h2>What we didn't know</h2><p>${esc(m.surprise.text)}${cites(m.surprise.cites)}</p></div>`;
  h+=`<p class="hint" style="margin:0 0 4px"><a href="${esc(m.live_url)}" target="_blank" rel="noopener">${esc(m.name)}</a> — ${esc(m.one_liner)}</p>`;
  h+=`<section class="blk"><h2>How they differ · ${m.segments.length} kinds of customer</h2><div class="segs">`+m.segments.map(s=>
    `<article class="seg-card"><h3>${esc(s.name)}</h3><p class="who">${esc(s.who)}</p>`+
    ROWS.filter(([k])=>s[k]&&s[k].length).map(([k,label,cls])=>`<div class="row"><h4>${label}</h4>${list(s[k],cls)}</div>`).join('')+'</article>').join('')+
    `</div><p class="hint">Swipe for the next kind of customer.</p></section>`;
  h+=`<section class="blk"><h2>Jobs our tool doesn't do · ${gaps.length} of ${m.job_map.length}</h2><div class="gaps">`+
    gaps.map(g=>`<div class="gap"><b>Gap</b> · ${esc(g.job)}<div class="seg">${esc(g.segment)} — ${esc(g.why)}</div></div>`).join('')+
    part.map(g=>`<div class="gap"><b style="color:var(--accent)">Partly</b> · ${esc(g.job)}<div class="seg">${esc(g.segment)} — step ${esc(g.step)}: ${esc(g.why)}</div></div>`).join('')+
    `</div></section>`;
  h+=`<section class="blk"><h2>Measured, not modelled</h2><ul class="facts">`+m.facts.map(f=>`<li>${esc(f.text)} <span class="hint">(${esc(f.source)})</span></li>`).join('')+`</ul></section>`;
  document.getElementById('view').innerHTML=h;
  const v=m.verification;
  document.getElementById('foot').innerHTML=`${esc(m.name)}: read ${m.evidence.rows_read} of ${m.evidence.rows_available} evidence rows (${Object.entries(m.evidence.by_source).map(([k,n])=>n+' '+k.replace('_',' ')).join(', ')}). ${v.claims} claims proposed by ${esc(m.model)}; every kept line quotes its source word for word, checked by script — ${v.dropped_claims||0} claims and ${v.bad_cites||0} citations failed and were dropped. Nothing here says whether anyone will use or buy; it says who they are and what they need.`;
  try{localStorage.setItem('cl_tab',i)}catch(e){}
  if(window.va)va('event',{name:'tab',data:{product:m.product}});
}
document.getElementById('tabs').innerHTML=D.maps.map((m,i)=>`<button role="tab" data-i="${i}">${esc(m.name.split(' (')[0])}</button>`).join('');
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)render(+b.dataset.i)});
document.addEventListener('click',e=>{const b=e.target.closest('button.c[data-q]');if(!b)return;const q=document.getElementById(b.dataset.q);const o=q.classList.toggle('open');b.setAttribute('aria-expanded',o)});
const C=D.cal;
document.getElementById('cal').innerHTML=`<h2>Before any send: the screen</h2>
<p style="margin:0 0 10px">Persona role-play could not tell who would reply (AUC ≈ 0.5). An outside-view forecaster could. Here it is on our ${C.n} real sends, ranked by its prediction:</p>
<table><tr><th>Forecast rank</th><th class="n">Sends</th><th class="n">Predicted</th><th class="n">Replied</th></tr>`+
C.buckets.map(b=>`<tr><td>${b.name}</td><td class="n">${b.n}</td><td class="n">${(b.pred*100).toFixed(1)}%</td><td class="n">${b.k} (${(b.act*100).toFixed(1)}%)</td></tr>`).join('')+
`</table><p class="hint">${C.k} replies so far, so this ranks drafts; it does not decide what to build. Every new draft is scored and logged before it goes (${C.live} so far), and scored again when the inbox answers.</p>`;
let start=0;try{start=+(localStorage.getItem('cl_tab')||0)}catch(e){}
render(Math.min(start,D.maps.length-1));
</script>
